          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = urlparse(self.path).path
                  payload = ROUTES.get(path)
                  if payload is None:
                      if path.startswith("/api/classes/") and path.endswith("/pupils"):
                          payload = ROUTES["/api/classes/1/pupils"]
                      elif path.startswith("/api/cards/class/"):
                          payload = ROUTES["/api/cards/class/1"]
                      elif path.startswith("/api/timeouts/class/"):
                          payload = ACTIVE_TIMEOUTS
                      else:
                          payload = {}
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_POST(self):
                  self.do_GET()

              def log_message(self, format, *args):
                  pass

          server = ThreadingHTTPServer(("127.0.0.1", 3000), Handler)
          server.serve_forever()
