          curl -fsS http://127.0.0.1:3000/api/auth/me

      - name: Add temporary UITest target and generate Xcode project
        run: |
          mkdir -p SMILEUITests
          cat <<'SWIFT' > SMILEUITests/ScreenshotUITests.swift
          import XCTest

          final class ScreenshotUITests: XCTestCase {
              private func saveScreenshot(_ app: XCUIApplication, name: String) {
                  let attachment = XCTAttachment(screenshot: app.screenshot())
                  attachment.name = name
                  attachment.lifetime = .keepAlways
                  add(attachment)
              }

              private func tapTab(_ app: XCUIApplication, label: String) {
                  let tabBtn = app.tabBars.buttons[label]
                  if tabBtn.waitForExistence(timeout: 3) {
                      tabBtn.tap()
                      return
                  }
                  let anyBtn = app.buttons[label].firstMatch
                  if anyBtn.waitForExistence(timeout: 3) {
                      anyBtn.tap()
                  }
              }

              func testCaptureAppStoreScreenshots() throws {
                  let app = XCUIApplication()
                  app.launch()

                  // Wait for Schulalltag data to populate
                  let pupil = app.staticTexts["Berger Anna"]
                  _ = pupil.waitForExistence(timeout: 12)
                  sleep(1)
                  saveScreenshot(app, name: "01_Schulalltag")

                  tapTab(app, label: "Bewertung")
                  sleep(2)
                  saveScreenshot(app, name: "02_Bewertung")

                  tapTab(app, label: "Lernwerkstatt")
                  sleep(2)
                  saveScreenshot(app, name: "03_Lernwerkstatt")

                  tapTab(app, label: "Schulstatistik")
                  sleep(2)
                  saveScreenshot(app, name: "04_Schulstatistik")
              }
          }
          SWIFT

          cat <<'YAML' >> project.yml

            SMILEUITests:
              type: bundle.ui-testing
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: SMILEUITests
              dependencies:
                - target: SMILE
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: at.ac.ms-telfs.smile.uitests
                  CODE_SIGN_STYLE: Automatic
                  DEVELOPMENT_TEAM: ""
          YAML

          xcodegen generate

      - name: Build for Testing and capture iPhone & 13-inch iPad screenshots
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, glob

          devices_raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          devices_data = json.loads(devices_raw)["devices"]

          def find_udid(prefixes):
              for pref in prefixes:
                  for runtime, devs in sorted(devices_data.items(), reverse=True):
                      if "iOS" not in runtime:
                          continue
                      for d in devs:
                          if d.get("isAvailable") and d["name"].startswith(pref):
                              return d["udid"], d["name"], runtime
              raise RuntimeError(f"No matching simulator found for {prefixes}")

          iphone_udid, iphone_name, _ = find_udid([
              "iPhone 17 Pro",
              "iPhone 16 Pro",
              "iPhone 17",
              "iPhone 16",
              "iPhone 15 Pro",
              "iPhone 15",
          ])
          ipad_udid, ipad_name, _ = find_udid([
              "iPad Pro 13-inch",
              "iPad Pro (13-inch)",
              "iPad Air 13-inch",
              "iPad Pro (12.9-inch)",
          ])

          print(f"Selected iPhone simulator: {iphone_name} ({iphone_udid})")
          print(f"Selected iPad simulator:   {ipad_name} ({ipad_udid})")

          subprocess.run([
              "xcodebuild", "build-for-testing",
              "-project", "SMILE.xcodeproj",
              "-scheme", "SMILEUITests",
              "-destination", f"id={iphone_udid}",
              "-derivedDataPath", "build/DerivedData",
              "CODE_SIGNING_ALLOWED=NO",
              "CODE_SIGNING_REQUIRED=NO",
              "CODE_SIGN_IDENTITY=",
              "CODE_SIGN_STYLE=Automatic",
          ], check=True)

          app_paths = glob.glob("build/DerivedData/Build/Products/Debug-iphonesimulator/SMILE.app")
          if not app_paths:
              raise RuntimeError("Built SMILE.app not found")
          app_path = app_paths[0]

          os.makedirs("build/appstore-screenshots/iphone", exist_ok=True)
          os.makedirs("build/appstore-screenshots/ipad-13", exist_ok=True)

          for label, udid, out_dir in [
              ("iphone", iphone_udid, "build/appstore-screenshots/iphone"),
              ("ipad-13", ipad_udid, "build/appstore-screenshots/ipad-13"),
          ]:
              subprocess.run(["xcrun", "simctl", "boot", udid], check=False)
              subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True)
              subprocess.run(["xcrun", "simctl", "install", udid, app_path], check=True)
              subprocess.run([
                  "xcrun", "simctl", "spawn", udid, "defaults", "write",
                  "at.ac.ms-telfs.smile", "smile_server_base_url", "http://127.0.0.1:3000"
              ], check=True)

              xcresult = f"build/TestResults-{label}.xcresult"
              shutil.rmtree(xcresult, ignore_errors=True)
              subprocess.run([
                  "xcodebuild", "test-without-building",
                  "-project", "SMILE.xcodeproj",
                  "-scheme", "SMILEUITests",
                  "-destination", f"id={udid}",
                  "-derivedDataPath", "build/DerivedData",
                  "-resultBundlePath", xcresult,
                  "CODE_SIGNING_ALLOWED=NO",
                  "CODE_SIGNING_REQUIRED=NO",
                  "CODE_SIGN_IDENTITY=",
                  "CODE_SIGN_STYLE=Automatic",
              ], check=True)

              raw_dir = f"build/raw-{label}"
              shutil.rmtree(raw_dir, ignore_errors=True)
              os.makedirs(raw_dir, exist_ok=True)
              subprocess.run([
                  "xcrun", "xcresulttool", "export", "attachments",
                  "--path", xcresult,
                  "--output-path", raw_dir,
              ], check=True)

              exported = sorted(glob.glob(f"{raw_dir}/**/*.png", recursive=True))
              if not exported:
                  raise RuntimeError(f"No attachments exported from {xcresult}")

              for idx, png in enumerate(exported, start=1):
                  base = os.path.splitext(os.path.basename(png))[0]
                  jpg = os.path.join(out_dir, f"{idx:02d}_{base}.jpg")
                  subprocess.run([
                      "sips", "-s", "format", "jpeg", "-s", "formatOptions", "95", png, "--out", jpg
                  ], check=True)
                  dims = subprocess.check_output(["sips", "-g", "pixelWidth", "-g", "pixelHeight", jpg], text=True)
                  print(f"[{label}] {jpg}:\n{dims.strip()}")
          PY

      - name: Upload App Store Screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMILE-appstore-screenshots
          path: ios/build/appstore-screenshots
