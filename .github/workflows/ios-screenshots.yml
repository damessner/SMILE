name: SMILE iOS App Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture-screenshots:
    name: Capture Simulator Screenshots (iPhone & 13-inch iPad)
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios

