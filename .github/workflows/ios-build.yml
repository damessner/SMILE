name: SMILE iOS App Build & TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Sign & Upload to TestFlight
    # The `xcode-27` image (macOS 26 + Xcode 27, iOS 27 SDK) is required because Apple
    # rejects uploads built with older SDKs (ITMS-90725: from April 2027 the iOS 27
    # SDK / Xcode 27 is mandatory for App Store Connect). The plain macos-26 image only
    # ships Xcode <= 26.6 (iOS 26.5 SDK).
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest installed Xcode and print SDK version
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'iphonesimulator' | tail -3

      - name: Generate Xcode project with XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Upload generated SMILE.xcodeproj artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMILE-xcodeproj
          path: ios/SMILE.xcodeproj

      - name: Build for iOS Simulator (Typecheck & Compile Verification)
        run: |
          xcodebuild build \
            -project SMILE.xcodeproj \
            -scheme SMILE \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf "%s" "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Convert to Apple legacy 3DES format if modern OpenSSL was used
          TARGET_P12=$RUNNER_TEMP/certificate.p12
          if openssl pkcs12 -in $RUNNER_TEMP/certificate.p12 -nodes -passin pass:"$P12_PASSWORD" -out $RUNNER_TEMP/bundle.pem 2>/dev/null; then
            openssl pkcs12 -export -in $RUNNER_TEMP/bundle.pem -out $RUNNER_TEMP/apple_cert.p12 -passout pass:"$P12_PASSWORD" -legacy 2>/dev/null || cp $RUNNER_TEMP/certificate.p12 $RUNNER_TEMP/apple_cert.p12
            TARGET_P12=$RUNNER_TEMP/apple_cert.p12
          fi

          security import "$TARGET_P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf "%s" "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > $RUNNER_TEMP/profile.mobileprovision

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/profile.mobileprovision))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/profile.mobileprovision))
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "Installed Provisioning Profile UUID: $PROFILE_UUID ($PROFILE_NAME)"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Build & Archive App Store Release
        run: |
          mkdir -p build
          xcodebuild archive \
            -project SMILE.xcodeproj \
            -scheme SMILE \
            -configuration Release \
            -archivePath build/SMILE.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=ZC5QZ8N67B \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export App Store IPA
        run: |
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/profile.mobileprovision))
          echo "Profile Name: $PROFILE_NAME"

          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>ZC5QZ8N67B</string>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>at.ac.ms-telfs.smile</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/SMILE.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/export

      - name: Upload Signed IPA to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 ~/.private_keys/AuthKey_${KEY_ID}.p8

          xcrun altool --upload-app \
            -f build/export/SMILE.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: SMILE-ipa
          path: ios/build/export/SMILE.ipa
          if-no-files-found: ignore
