name: SMILE
options:
  bundleIdPrefix: at.ac.ms-telfs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: SMILE/Info.plist

targets:
  SMILE:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SMILE
        excludes:
          - Info.plist
    resources:
      - path: SMILE/Resources/Assets.xcassets
      - path: SMILE/Resources/smile-internal-ca.cer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.ac.ms-telfs.smile
        PRODUCT_NAME: SMILE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
